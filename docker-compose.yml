services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
      POSTGRES_DB: ${POSTGRES_DB:-news}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Ad hoc DB inspection, opt-in only — not started by a plain `docker compose up`
  # (`docker compose --profile tools up adminer` to run it). Bound to localhost only, not
  # 0.0.0.0: Adminer's own login is just the Postgres credentials, and this project's default
  # POSTGRES_PASSWORD is a weak, publicly-documented value, so this must never be reachable
  # from outside the host. `mise run studio` (Prisma Studio) is the everyday equivalent that
  # needs no container at all — reach for this only when Adminer's SQL console specifically is
  # what you need.
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@db:5432/${POSTGRES_DB:-news}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4o}
      ENTITY_MODEL: ${ENTITY_MODEL:-gpt-4o}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INGESTION_SECRET: ${INGESTION_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      PORT: 3001
      HOST: 0.0.0.0
      SERVICE_NAME: backend
    ports:
      - '3001:3001'
    volumes:
      - ./logs:/app/packages/backend/logs
    depends_on:
      db:
        condition: service_healthy

  # Same image as `backend`, different entrypoint — see ADR 0028 / ticket 13. No job handlers
  # are registered yet (tickets 14/15/17), so this currently just keeps the pg-boss queues alive.
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/worker.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news}@db:5432/${POSTGRES_DB:-news}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4o}
      ENTITY_MODEL: ${ENTITY_MODEL:-gpt-4o}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      SERVICE_NAME: worker
    volumes:
      - ./logs:/app/packages/backend/logs
    depends_on:
      db:
        condition: service_healthy

  # Polls POST /api/ingestion/run on a timer — see ADR 0013. Not started until INGESTION_SECRET
  # is set; the endpoint itself always rejects without it, so this is safe to leave unconfigured.
  ingestion-cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      INGESTION_SECRET: ${INGESTION_SECRET}
    depends_on:
      - backend
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          # --max-time is a safety net against a truly hung connection (P2-20, docs/audit.md),
          # not a step-timing mechanism — kept well above any realistic run duration so it can't
          # itself cause a normal-but-slow run to be treated as failed. If curl times out or
          # errors, runIngestionPass may still be running server-side when the next tick starts;
          # nothing currently locks against that overlap (P2-22, tracked in the async-job-queue
          # ticket at .scratch/backend-audit/issues/06-async-job-queue.md) — this flag only stops
          # curl itself from blocking forever, it doesn't add that protection.
          curl -sf --max-time 600 -X POST -H "x-ingestion-secret: $$INGESTION_SECRET" http://backend:3001/api/ingestion/run \
            || echo "[ingestion-cron] request failed or timed out (curl exit $?)"
          sleep 1200
        done

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
