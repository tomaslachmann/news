[tools]
node = "22"
npm = "latest"

# ── Development ──────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start backend (tsx watch :3001) + frontend (Vite :5173) with hot-reload"
run = "npm run dev"

[tasks.db]
description = "Start only the Postgres container in the background"
run = "docker compose up -d db"

[tasks.db-stop]
description = "Stop the Postgres container"
run = "docker compose stop db"

[tasks."ingestion-cron"]
description = "Opt-in local Ingestion poller (not part of `dev` — every poll can spend real OpenAI money)"
run = "npm run ingestion:cron"

[tasks.worker]
description = "Opt-in local job-queue worker (not part of `dev` — no job handlers registered yet, see ticket 13)"
run = "npm run worker"

# ── Type checking & building ──────────────────────────────────────────────────

[tasks.typecheck]
description = "Run tsc --noEmit across backend and frontend"
run = "npm run typecheck"

[tasks.build]
description = "Build the frontend Vite bundle into packages/frontend/dist/"
run = "npm run build"

# ── Database ──────────────────────────────────────────────────────────────────

[tasks.migrate]
description = "Run prisma migrate dev (creates and applies a new migration)"
run = "npm run db:migrate --workspace=packages/backend"

[tasks.migrate-deploy]
description = "Run prisma migrate deploy (apply pending migrations without prompts)"
run = "npm run db:migrate:deploy --workspace=packages/backend"

[tasks.studio]
description = "Open Prisma Studio in the browser (database GUI)"
run = "npx --prefix packages/backend prisma studio"

# ── Testing & linting ─────────────────────────────────────────────────────────

[tasks.test]
description = "Run unit tests only (no Docker required)"
run = "npm test"

[tasks."test:integration"]
description = "Run the testcontainers-backed integration suite (requires Docker)"
run = "npm run test:integration"

[tasks.lint]
description = "Run ESLint across all packages"
run = "npm run lint"

[tasks.format]
description = "Check formatting across all packages with Prettier"
run = "npx prettier --check ."

# ── Ticket workflow ────────────────────────────────────────────────────────────

[tasks.ticket-start]
description = "Start a ticket: checks blockers are done, then creates and checks out its branch"
run = "node scripts/ticket-start.mjs"

[tasks."ticket-done"]
description = "Finish a ticket: verifies its checklist, flips status, commits, pushes, prints the compare URL"
run = "node scripts/ticket-done.mjs"

# ── Docker Compose ────────────────────────────────────────────────────────────

[tasks.up]
description = "Build and start all three Docker services (frontend, backend, db)"
run = "docker compose up --build"

[tasks.up-detached]
description = "Build and start all Docker services in the background"
run = "docker compose up --build -d"

[tasks.down]
description = "Stop and remove all Docker containers"
run = "docker compose down"

[tasks.logs]
description = "Tail logs from all Docker services"
run = "docker compose logs -f"
