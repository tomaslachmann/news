<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Triangulator</title>
    <link rel="preload" href="/fonts/newsreader-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-tight-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Applies the stored/system theme before the bundle loads (ADR 0031 — localStorage, not a
      // server/cookie read, since this is an unauthenticated static SPA with no SSR) so a
      // dark-preferring visitor never sees a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('nt-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
