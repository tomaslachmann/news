name: CI

on:
  push:
    branches:
      - 'ticket/**'
  pull_request:
    branches:
      - main

# A ticket branch's push and its open PR's synchronize event both fire for the same commit —
# without this, integration (now running on push too, not just pull_request) would run twice per
# commit. Grouping by the actual commit SHA (falling back to the ref for events with no PR head)
# means the later-starting event's run cancels the earlier one instead of both running to completion.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  fast:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run test:integration
